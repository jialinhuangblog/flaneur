  - id: day-13
    date: 2026-08-23
    weekday: Sun
    country: JP
    city: 仙台
    transitCities: [宇都宮, 東京]
    title: 宇都宮一日｜地下三十公尺的採石場
    overview: やまびこ 南下宇都宮，巴士上大谷看挖空七十年的地下空間，中午在宇都宮駅 吃完接著南下東京，晚上從上野 直接回仙台
    events:
      - id: e-d13-01
        time: "09:00"
        duration: 77
        title: "[東北新幹線] やまびこ210号 仙台 → 宇都宮 10:17 着 (origin: ¥8880 -> 0)"
        type: train
        highlight: true
        booking:
          coach: 8
          seat: 9C
        notes:
          - 已劃，8 號車 9 番 C 席，仙台 09:00 発、宇都宮 10:17 着 [SRC:用戶截圖 訂位確認]
      - id: e-d13-02
        time: "10:36"
        duration: 35
        title: 關東巴士 宇都宮駅西口 6 番 → 資料館入口（先買大谷観光一日乗車券 ¥2,200）
        type: transit
        notes:
          - 出發前先買「大谷観光一日乗車券」大人 ¥2,200。內容是大谷・立岩線 巴士一日券＋大谷資料館入場券＋大谷観音（大谷寺）拝観券 [SRC:kantobus.co.jp topics id=1004 與宣傳單 PDF]
          - 宇都宮市官網那頁還寫 ¥2,000，更新日停在 2024-04-01。大谷資料館 2026 年 4 月改價，大人 800 → 1,000 [SRC:oya909.co.jp/access]，券價跟著漲 200，中学生 1,400、小学生 700 沒動
          - 宣傳單上的通常合計 ¥2,700 拆法：巴士來回 ¥1,200＋大谷資料館 ¥1,000＋大谷寺 ¥500，買券省 ¥500 [SRC:關東巴士宣傳單 PDF]。實測宇都宮駅西口 → 資料館入口 單程 ¥530 [SRC:kantobus.info 運賃檢索]，光來回加資料館就超過券價
          - 持券在来らっせ本店 用餐送一杯飲料，二荒山神社、松が峰教会、栃木県立美術館 也有優惠 [SRC:關東巴士宣傳單 PDF]
          - 販售點：宇都宮市観光案内所在在來線改札口旁，全日 9:00–14:50，最近；関東自動車宇都宮駅前定期券センター 在西口走 1 分，週日 8:30–12:00／13:00–17:00 [SRC:關東巴士宣傳單 PDF]。10:17 下車先買再上巴士
          - 搭「大谷・立岩行き」，約 30 分，下車走 5 分 [TOOL-SUM]
          - 週日 45 系統 駅西口 発 → 資料館入口 着：10:19→10:46、10:36→11:03、10:59→11:26、11:23→11:50、11:43→12:10 [SRC:kantobus.info 發著檢索 日曜･祝日]
          - 10:17 到站接 10:19 來不及，10:36 是買完券趕得上的第一班；沒趕上就 10:59，館內時間少 23 分
          - 關東巴士不是 JR，PASS 不含
          - 套票的巴士有效範圍只有大谷・立岩線這一條，券面記載的停留所之間自由上下 [SRC:宇都宮市官網 1007246]
          - 馬場町 在這條線上，資料館入口 → 馬場町 系統01、¥530、17–22 分，跟坐到宇都宮駅西口 同價，券吃得到 [SRC:kantobus.info 運賃檢索]。只是大谷・立岩線半小時一班；等不到就搭別條線回站，現金 ¥190、約 9 分，那個站牌往車站的車兩三分鐘一班 [SRC:kantobus.info 時刻表]
          - 来らっせ本店「馬場町」下車走 1 分，下車跟回程上車同一站，不用繞去東武駅前。土日祝 11:00–21:00（L.O. 20:30），無休，028-614-5388 [SRC:關東巴士宣傳單 PDF]
          - 官方示範行程的最後一段就是「馬場町 → JR宇都宮駅」用同一張券 [SRC:關東巴士宣傳單 PDF]
          - 「県庁前」跟「馬場町」的乗り場依行先不同，上車前看站牌方向 [SRC:關東巴士宣傳單 PDF]
          - 去程搭「大谷・立岩」行；回程從立岩 那頭過來的是「宇都宮駅」行 [SRC:關東巴士宣傳單 PDF]
        sources:
          - type: SRC
            label: 關東巴士 大谷観光一日乗車券 宣傳單 PDF（券價、販售點、路線圖、示範行程、協力設施）
            url: https://www.kantobus.co.jp/common/sysfile/topics/ID00000831binary1.pdf
          - type: SRC
            label: 關東巴士 企画乗車券 topics（大人 ¥2,200）
            url: https://www.kantobus.co.jp/topics/topics.php?id=1004
          - type: SRC
            label: 宇都宮市官網 大谷観光一日乗車券（有效範圍只限大谷・立岩線；價格仍寫 ¥2,000，更新日 2024-04-01）
            url: https://www.city.utsunomiya.lg.jp/citypromotion/kanko/oshirase/1007246.html
          - type: SRC
            label: 大谷資料館 料金・アクセス（2026 年 4 月改價，大人 ¥1,000）
            url: https://www.oya909.co.jp/access/
          - type: SRC
