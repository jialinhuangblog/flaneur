# 東北 16 天（tripenjp：e for east, n for north）
# 富士山定點 2 晚 + JR EAST PASS 10 日：福島 1 晚 → 青森 3 晚 → 秋田 3 晚 → 仙台 4 晚，四個定點各自放射
# seed： pnpm tsx scripts/seed.ts public/trip-enjp.yaml
# 原則：懶人玩法。景點在車站步行圈或公車可達，零爬坡、零溫泉、過程型搭車。
# 時刻凡標 [GUESS] 者出發前用乘換案內釘死。
# PASS 帳：範圍內 23 段原價合計 ¥102,028（2026-08-24 重算）
# 指定席特急料金有季節加減：最繁忙期 +400、繁忙期 +200、閑散期 -200。8/7・8・15・16 最繁忙期，8/17・21–23 繁忙期，8/24–27 閑散期 [SRC:jreast.co.jp/kippu/1202.html]
# ekitan／navitime 不管填哪天都只顯示通常期，所以那邊查到的數字要自己套季節

