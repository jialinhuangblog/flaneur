# 香港 7 天（張國榮 × 九〇年代港片 × 熊貓）
# seed： pnpm tsx scripts/seed.ts public/trip-hk.yaml
# 去程：香港快運 UO111 12/29 13:55 TPE T1 → 16:00 HKG T1，Trip.com TWD 2,994 [SRC:用戶截圖]
# 回程：長榮 BR868 1/4 13:30 HKG → 15:20 TPE [SRC:用戶截圖]
# 未訂：住宿（候選麻雀客棧，土瓜灣，6 晚同一間）
# 週二休：香港文化博物館、香港電影資料館（12/29 抵達日，沒排這兩個）
# 1/1 公眾假期；12/31 晚上維港跨年
# 交通：全程旅客八達通。地鐵、巴士、叮叮、天星小輪、便利店都能刷

meta:
  id: hong-kong-2027
  title: 香港 7 天（張國榮 × 港片 × 熊貓）
  startDate: 2026-12-29
  endDate: 2027-01-04
  traveler: Jialin
  luggage: 同一間住 6 晚，行李不用搬
  primer:
    title: 出發前預習
    subtitle: 點地名，看它在哪一塊、哪天會去
    regions:
      - { id: nt, label: 新界, en: NEW TERRITORIES, h: 24 }
      - { id: kln, label: 九龍, en: KOWLOON, h: 34 }
      - { id: harbour, label: 維多利亞港, h: 9, water: true }
      - { id: hki, label: 香港島, en: HONG KONG ISLAND, h: 33 }
    places:
      - id: shatin
        name: 沙田
        region: nt
        x: 55
        y: 12
        body: 新界的市鎮。香港文化博物館的張國榮紀念展、寶福山的張國榮靈位都在這裡。
        days: [day-04]
        src: TOOL-SUM
      - id: yuenlong
        name: 元朗
        region: nt
        x: 16
        y: 10
        body: 新界西北，靠近深圳。港片裡說「上元朗」，多半是要去鄉下。你清單裡的萬芳冰室在附近的洪水橋一帶。
        src: GUESS
      - id: shamshuipo
        name: 深水埗
        region: kln
        x: 15
        y: 33
        body: 九龍的老區。鴨寮街賣電子零件和舊貨，美荷樓也在這一帶。
        days: [day-06]
        src: GUESS
      - id: mongkok
        name: 旺角
        region: kln
        x: 37
        y: 35
        body: 全香港最擠的地方。金魚街、太子道西 179 號都在這一帶。
        days: [day-06]
        films: [旺角卡門, 星月童話]
        src: GUESS
      - id: choihung
        name: 彩虹
        region: kln
        x: 80
        y: 29
        body: 東九龍的住宅區。彩虹邨 2028 年起分期清拆，第一期目標 2029-04 清空。
        days: [day-06]
        src: TOOL-SUM
      - id: kowlooncity
        name: 九龍城
        region: kln
        x: 62
        y: 39
        body: 舊機場啟德就在旁邊。九龍寨城 1993 年清拆，改成公園。潮州菜、泰國菜很多。
        days: [day-04]
        films: [阿飛正傳]
        src: TOOL-SUM
      - id: tokwawan
        name: 土瓜灣
        region: kln
        x: 67
        y: 49
        body: 九龍城南邊的老住宅區，候選住宿麻雀客棧在這。城巴 A22 從土瓜灣街市直達機場，HK$40.8。
        src: SRC
      - id: yaumatei
        name: 油麻地
        region: kln
        x: 29
        y: 45
        body: 廟街、美都餐室、百老匯電影中心、油麻地戲院都在這一帶。
        days: [day-02, day-06]
        films: [廟街故事]
        src: GUESS
      - id: westkowloon
        name: 西九
        region: kln
        x: 9
        y: 52
        body: 西九文化區。填海出來的一片，有 M+ 博物館和海濱草地，正對港島的天際線。
        days: [day-03, day-06]
        src: GUESS
      - id: tsimshatsui
        name: 尖沙咀
        region: kln
        x: 42
        y: 54
        body: 九龍最南端，正對港島。重慶大廈、星光大道、天星碼頭都在這。
        days: [day-01]
        films: [重慶森林, 墮落天使]
        src: TOOL-SUM
      - id: sheungwan
        name: 上環
        region: hki
        x: 9
        y: 79
        body: 中環西邊的老區。文武廟在這，還有一整條賣乾貨海味的街。
        days: [day-03]
        films: [胭脂扣]
        src: GUESS
      - id: central
        name: 中環
        region: hki
        x: 25
        y: 71
        body: 金融區。文華東方、都爹利街石階、藝穗會、中銀大廈、半山扶手電梯、山頂纜車站都在這裡。
        days: [day-03, day-05]
        films: [重慶森林, 金枝玉葉, 阿飛正傳]
        src: TOOL-SUM
      - id: wanchai
        name: 灣仔
        region: hki
        x: 42
        y: 74
        body: 中環跟銅鑼灣之間的老街和酒吧區，叮叮從這裡穿過去。
        days: [day-05]
        src: GUESS
      - id: causewaybay
        name: 銅鑼灣
        region: hki
        x: 58
        y: 79
        body: 購物區。南華體育會、烏鴉手勢打卡點都在這。古惑仔裡陳浩南管的地盤就是銅鑼灣。
        days: [day-05]
        films: [阿飛正傳, 古惑仔]
        src: TOOL-SUM
      - id: quarrybay
        name: 鰂魚涌
        region: hki
        x: 75
        y: 71
        body: 港島東邊的住宅區，怪獸大廈在這。
        days: [day-05]
        src: GUESS
      - id: saiwanho
        name: 西灣河
        region: hki
        x: 87
        y: 81
        body: 香港電影資料館在這，週二休館。
        days: [day-05]
        src: TOOL-SUM
      - id: aberdeen
        name: 香港仔
        region: hki
        x: 30
        y: 91
        body: 港島南面，海洋公園在這附近，搭南港島綫到海洋公園站。
        days: [day-02]
        src: GUESS

days:
