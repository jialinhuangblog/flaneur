        type: transit
        paymentSystem: Octopus
        mapQuery: "Star Ferry Tsim Sha Tsui Pier"
      - id: e-d01-08
        time: "22:30"
        title: 宿：未訂，候選麻雀客棧（6 晚 · 12/29→1/4 退）
        type: hotel
        highlight: true
        address: 土瓜灣北帝街16號
        mapQuery: "The Mahjong Hostel To Kwa Wan"
        notes:
          - 8 床女性宿舍 6 晚 TWD 10,386 含稅，不可退 [SRC:booking.com]
          - 前台 09:00–23:00，晚到要先通知 [SRC:booking.com]

