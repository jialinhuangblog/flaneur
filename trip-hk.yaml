    weekday: Tue
    country: HK
    transitCountries: [TW]
    city: 尖沙咀
    title: 抵香港、星光大道、維港夜景
    overview: 下午落地、進市區放行李、晚上星光大道看梅艷芳銅像和張國榮手印、天星小輪過海
    events:
      - id: e-d01-01
        time: "13:55"
        duration: 125
        title: 香港快運 UO111 TPE 桃園 T1 → HKG T1
        type: flight
        highlight: true
        cost: TWD 2,994（Trip.com）
        booking:
          ref: __SECRET__
          system: Trip.com
        notes:
          - 13:55 起飛、16:00 抵香港 T1，飛 2 小時 5 分 [SRC:用戶截圖]
          - 託運 1 件 20 公斤，長＋寬＋高 158 公分以內 [SRC:用戶截圖]
          - 個人物品 1 件，40×25×20 公分以內、放前方座位下，最重 7 公斤；票價不含手提行李 [SRC:用戶截圖]
          - 不可退款；改期 TWD 2,903 起 [SRC:用戶截圖]
        warnings:
          - level: amber
            text: 超出個人物品規格要在登機口改託運，每件 HK$800 [TOOL-SUM]
      - id: e-d01-02
        time: "16:00"
        duration: 60
        title: 抵 HKG、通關領行李、買旅客八達通
        type: arrival
        highlight: true
        mapQuery: "Hong Kong International Airport"
        notes:
          - 旅客八達通 HK$39，不含儲值、不用按金 [TOOL-SUM]
          - MTR Tourist Day Pass HK$75 / 24 小時無限搭地鐵，一天搭 6 趟以上才划算 [TOOL-SUM]
        sources:
          - type: TOOL-SUM
            label: MTR 與八達通 2026 整理
            url: https://themoneybees.co/blog/hong-kong-mtr
      - id: e-d01-03
        time: "17:00"
        duration: 60
        title: 機場 → 住處
        type: transit
        paymentSystem: Octopus
        notes:
          - 住土瓜灣：城巴 A22 在機場地面運輸中心上車，土瓜灣街市（馬頭圍道）下車，HK$40.8 [SRC:運輸署路線票價資料]
        sources:
          - type: SRC
            label: 運輸署 巴士路線票價資料
            url: https://static.data.gov.hk/td/routes-fares-xml/FARE_BUS.xml
      - id: e-d01-04
        time: "18:00"
        duration: 60
        title: 住處 check-in、休息
        type: rest
      - id: e-d01-05
        time: "19:00"
        duration: 60
        title: 晚餐：尖沙咀茶餐廳
        type: meal
      - id: e-d01-06
        time: "20:00"
        duration: 60
        title: 星光大道：梅艷芳銅像、張國榮手印
        type: attraction
        highlight: true
        mapQuery: "Avenue of Stars Hong Kong"
        notes:
          - 2004 年開幕，有梅艷芳銅像、李小龍銅像、張國榮紀念牌匾 [TOOL-SUM]
          - 歌迷會在張國榮手印前放花 [TOOL-SUM]
        sources:
          - type: TOOL-SUM
            label: 走進星光大道追蹤李小龍梅艷芳
