        duration: 30
        title: 回程順路：Shag Point 夏格看台（岩石灘、海狗最多）
        type: photo
        mapQuery: "Shag Point Katiki"
      - id: e-d09-10
        time: "19:20"
        duration: 30
        title: 回程順路：Katiki Point 卡提奇燈塔（草地海狗最不怕人、可以近一點看）
        type: photo
        mapQuery: "Katiki Point Lighthouse"
        notes:
          - 這天塞很滿、市區跟半島擇重點跑、回程兩個點看天色挑著停
      - id: e-d09-11
        time: "21:30"
        duration: 150
        title: Oamaru 南邊海岸看極光（NOAA 預報 Kp 最高 5.7、G2）
        type: photo
        highlight: true
        warnings:
          - level: amber
            text: CME 到達時間常差好幾個小時，提早或晚到都有可能。傍晚先看 Otago 即時值跟 NOAA 當下 Kp，不要只信預報表
        notes:
          - Kp 預報（紐西蘭時間）：19:00–22:00 是 4.3、22:00–01:00 是 5.7（G2）、01:00–04:00 是 4.0。NOAA 10/7 00:30 UTC 發布
          - 來源是 10/6 太陽兩次 M 級閃焰拋出的 CME（日冕物質拋射），模型算 10/9 UTC 一早到地球
          - 月亮 3%、18:21 下山。日落 19:54、20:24 天全黑，整晚沒有月光
          - 雲量預報（Oamaru）：20:00–22:00 一成以下、23:00 三成、01:00 七成、02:00 之後全陰。雲跟 Kp 重疊最好的是 22:00–23:00
          - 10/5 皇后鎮那晚 Kp 4.7–5.0（G1 邊緣），Otago nowcast 2–3。這晚預報高一級
          - Kp 是 0–9 的全球地磁指數，每三小時一個值。Kp 5 = G1、6 = G2、7 = G3。NOAA 的小數是三分制，5.67 就是 6-
          - Otago 的 Dunedin Nowcast 也是 0–9，但量的是南島地磁儀此刻的偏移，10 分鐘重算一次。1–3 要相機長曝才拍到、4–6 肉眼可能看到、7–9 肉眼直接看到。跳到 4 以上就出門
          - app 上的 Bz 轉負（負 10 以下更好）、太陽風速衝到 500 km/s 以上，光會變亮。Bz 一直正的時候 Kp 再高也淡
          - 往南看。地點挑沒有路燈的海邊，背對市區。手機夜景模式長曝會比肉眼先看到
        sources:
          - type: SRC
            label: NOAA 三日 Kp 預報
            url: https://services.swpc.noaa.gov/text/3-day-forecast.txt
          - type: SRC
            label: Otago Aurora Alert（Dunedin Nowcast）
            url: https://auroraalert.otago.ac.nz/aurora/index.html
          - type: SRC
            label: Oamaru 逐時雲量
            url: https://api.open-meteo.com/v1/forecast?latitude=-45.097&longitude=170.970&hourly=cloud_cover&timezone=Pacific%2FAuckland

