      - id: e-d03-02
        time: "10:00"
        duration: 60
        title: Fergburger（cult 級漢堡、早去少排）
        type: meal
        mapQuery: "Fergburger Queenstown"
      - id: e-d03-03
        time: "11:00"
        duration: 60
        title: Saint Omer Park 湖邊散步
        type: attraction
        mapQuery: "Saint Omer Park Queenstown"
      - id: e-d03-04
        time: "12:00"
        duration: 60
        title: Patagonia Chocolates 冰淇淋（可以坐一下休息）
        type: meal
        mapQuery: "Patagonia Chocolates Queenstown"
        notes:
          - 南島最有名冰淇淋店、2005 年創始於 Arrowtown、手工巧克力 [SRC:Funliday PDF]
      - id: e-d03-05
        time: "13:00"
        duration: 60
        title: Queenstown Bay Beach 湖邊散步
        type: attraction
        mapQuery: "Queenstown Bay Beach"
      - id: e-d03-06
        time: "14:00"
        duration: 60
        title: Kaikikokiko 牛頰肉（slowcooked meats）
        type: meal
        mapQuery: "Kaikikokiko Queenstown"
      - id: e-d03-07
        time: "15:00"
        duration: 60
        title: 逛市區超市採購（Queenstown Mall）
        type: shopping
        mapQuery: "Queenstown Mall"
      - id: e-d03-08
        time: "16:00"
        duration: 90
        title: 逛街：Shotover St、Mall St、Beach St
        type: shopping
        mapQuery: "Shotover Street Queenstown"

  # =========================================================
  - id: day-04
    date: 2026-10-04
    weekday: Sun
    country: NZ
    title: Glenorchy 上午 + Arrowtown 下午 + Gibbston 酒莊
    overview: 一早進 Glenorchy（碼頭、Red Shed、潟湖步道、Paradise）、下午淘金小鎮、傍晚酒莊晚餐
    events:
      - id: e-d04-01
        time: "08:00"
        duration: 60
        title: Glenorchy Wharf & Viewpoint 格萊諾基碼頭
        type: photo
        highlight: true
        mapQuery: "Glenorchy Wharf"
        notes:
          - 皇后鎮開過去約 45 分、那條路是全紐最美自駕之一
      - id: e-d04-02
        time: "09:00"
        duration: 60
        title: Red Shed 紅色蒸汽船倉庫（小地標、可以進去逛）
        type: photo
        mapQuery: "Glenorchy Restored Steamship Depot"
      - id: e-d04-03
        time: "10:00"
        duration: 60
        title: Glenorchy Waterfront Reserve 濱海小徑走一走
        type: attraction
        mapQuery: "Glenorchy Waterfront Reserve"
      - id: e-d04-04
        time: "11:00"
        duration: 90
        title: Glenorchy Lagoon 潟湖步道（5.3km 全程約 2hr、難度易、可走 1.5h 版）
        type: attraction
        mapQuery: "Glenorchy Lagoon Scenic Walkway"
        notes:
          - 起點在 Glenorchy Waterfront 停車場、附近有廁所 [SRC:Funliday PDF]
      - id: e-d04-05
        time: "12:30"
        duration: 90
        title: Paradise 天堂地標（離市區來回車程 1h）
        type: photo
        mapQuery: "Paradise Glenorchy New Zealand"
        warnings:
          - level: amber
            text: 石子路、保險可能不理賠 [SRC:Funliday PDF]
      - id: e-d04-06
        time: "15:00"
        duration: 60
        title: Arrowtown 箭鎮主要街道 Buckingham Street
        type: attraction
        mapQuery: "Buckingham Street Arrowtown"
        notes:
          - 10 月是綠的、不是楓紅（楓紅要 4 月）
      - id: e-d04-07
        time: "16:00"
        duration: 60
        title: 湖區博物館 淘金體驗（可以借淘金用具去河邊試）
        type: attraction
        mapQuery: "Lakes District Museum Arrowtown"
        notes:
          - 49 Buckingham St、9:00–16:00、大人 $12 / 小孩 $5 / 家庭 $25 NZD [SRC:Funliday PDF]
      - id: e-d04-08
        time: "17:00"
        duration: 45
        title: Arrowtown Bakery（有鹿肉鹹派的咖啡店）
        type: meal
        mapQuery: "Arrowtown Bakery"
      - id: e-d04-09
        time: "18:10"
        duration: 90
        title: Gibbston Valley Winery & Restaurant（全紐最大洞穴酒窖）
        type: meal
        highlight: true
        mapQuery: "Gibbston Valley Winery"
        notes:
          - 1820 State Highway 6、酒窖導覽 $25 NZD、餐廳 11:30–15:00 [SRC:Funliday PDF]
          - 想跟導覽或吃餐廳要早點到、營業到 17:00 [SRC:Funliday PDF]

  # =========================================================
