# seed： pnpm tsx scripts/seed.ts public/trip-nz.yaml
# 已訂：TPE 來回機票、AKL→ZQN 10/2 12:35、CHC→AKL 10/11 18:10、皇后鎮 Amity 3 晚、Oamaru 2 晚、
#       基督城 1 晚、奧克蘭 SkyCity 2 晚、藍企鵝 10/8 20:00、Tasman Heli Hike 10/8 9:00（截圖為準、Funliday 的 10/7 是舊版）、
#       Wanaka Manuka Crescent 1 晚、Tekapo Tailor Made 2 晚、Deer Park Heights 10/3。
# 訂房通路：Amity 官網、SkyCity Trip.com、其餘四間 Agoda（booking.system）。
# 未訂：南島租車（10/2 ZQN 取、10/11 CHC 還）。
# 10/3–10/9 依 Funliday「紐西蘭 Good Timing」PDF 重排；10/10 之後 Funliday 空白、維持訂房版。
# 改完可重 seed（idempotent，保留照片）。

