# 紐西蘭 11 天行程（南島先 × 耍廢 × 電影雙透鏡）
# 來源草稿：~/Downloads/紐西蘭11天行程_v4.md
# seed： pnpm tsx scripts/seed.ts public/trip-nz.yaml
# 已訂：TPE 來回機票、AKL→ZQN 10/2 14:40、CHC→AKL 10/11 18:10、皇后鎮 Amity 3 晚、Oamaru 2 晚、
#       基督城 1 晚、奧克蘭 SkyCity 2 晚、藍企鵝 10/8 20:00、Tasman Heli Hike 10/8 9:00（截圖為準、Funliday 的 10/7 是舊版）。
# Funliday 選好、確認信未見：Wanaka Manuka Crescent 1 晚、Tekapo Tailor Made 2 晚。
# 未訂：南島租車（10/2 ZQN 取、10/11 CHC 還）、Hobbiton 一日團。
# 10/3–10/9 依 Funliday「紐西蘭 Good Timing」PDF 重排；10/10 之後 Funliday 空白、維持訂房版。
# 改完可重 seed（idempotent，保留照片）。

meta:
  id: new-zealand-2026
  title: 紐西蘭 11 天（南島先 × 耍廢）
  startDate: 2026-10-01
  endDate: 2026-10-13
  traveler: 與夥伴同行
  luggage: 自駕，行李放後車廂

days:
  # =========================================================
  - id: day-01
    date: 2026-10-01
    weekday: Thu
    country: TW
    transitCountries: [NZ]
    title: 桃機起飛
    overview: 出發、NZ078 TPE → AKL（紅眼直飛）
    events:
      - id: e-d01-01
        time: "18:35"
        duration: 640
        title: NZ078 TPE 桃園 T2 → AKL 奧克蘭
        type: flight
        highlight: true
        booking:
          ref: __SECRET__
        notes:
          - 飛行約 10h40m、隔天 10:15 抵奧克蘭（+1）
          - 與回程 NZ077 同一張票 [SRC:用戶截圖]

  # =========================================================
  - id: day-02
    date: 2026-10-02
    weekday: Fri
    country: NZ
    title: 抵奧克蘭、當天轉機進皇后鎮
    overview: 落地 10:15、轉國內線 AKL → ZQN、皇后鎮機場取南島車
    events:
      - id: e-d02-01
        time: "10:15"
        title: NZ078 抵 AKL 奧克蘭國際機場、通關領行李
        type: arrival
        highlight: true
      - id: e-d02-02
        time: "14:40"
        duration: 115
        title: 國內線 AKL 奧克蘭 → ZQN 皇后鎮（14:40 → 16:35）
        type: flight
        highlight: true
        booking:
          ref: __SECRET__
        notes:
          - Air NZ 已訂、三人 [SRC:用戶截圖]
          - 10:15 落地到 14:40 起飛有 4hr+、通關領行李轉航廈很夠、還能吃午餐
          - 國際轉國內航廈步行約 10 分（綠線）[GUESS]
      - id: e-d02-03
        time: "17:00"
        duration: 30
        title: 皇后鎮機場取南島租車（甲租乙還、基督城還）
        type: drive
        warnings:
          - level: amber
            text: 一定加 SCDW、南島碎石路常崩裂擋風玻璃 [TOOL-SUM]
      - id: e-d02-04
        time: "18:30"
        duration: 90
        title: 皇后鎮晚餐、湖邊散步（紅眼剛下、吃完早點收）
        type: meal
      - id: e-d02-05
        time: "22:00"
        title: 宿：Amity Serviced Apartments（南島 · 3 晚 · 10/2→10/5 退）
        type: hotel
        highlight: true
        address: 7 Melbourne Street, Queenstown 9348
        cost: "NZD 909 / 3 晚"
        booking:
          ref: __SECRET__
        mapQuery: "Amity Serviced Apartments Queenstown"
        notes:
          - One Bedroom Apartment with Mountain View、3 adults [SRC:用戶截圖]
          - 入住 14:00 後、退房 10:00 前；訂單填的 ETA 是 18:30 [SRC:用戶截圖]

  # =========================================================
