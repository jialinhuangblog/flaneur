  - id: day-03
    date: 2026-10-03
    weekday: Sat
    country: NZ
    title: 皇后鎮市區日｜纜車滑車 + Flame + 鹿園 + Fergburger
    overview: 早上 Skyline 纜車滑車、13:45 Flame Bar & Grill、16:30 Deer Park Heights 餵動物、20:30 Fergburger
    events:
      - id: e-d03-01
        time: "08:00"
        duration: 120
        title: Skyline 纜車 + 滑車
        type: attraction
        highlight: true
        mapQuery: "Skyline Queenstown New Zealand"
        notes:
          - Brecon St、Gondola 9:30–21:00、Luge 10:00–19:00 [SRC:Funliday PDF]
      - id: e-d03-10
        time: "13:45"
        duration: 90
        title: Flame Bar & Grill 午餐
        type: meal
        mapQuery: "Flame Bar & Grill Queenstown"
      - id: e-d03-09
        time: "16:30"
        duration: 120
        title: Deer Park Heights 自駕上山餵動物（鹿、驢、豬、山羊、迷你馬、看夕陽）
        type: attraction
        highlight: true
        address: 432 Peninsula Road, Kelvin Heights, Queenstown 9300
        cost: "NZD 75 / 車"
        booking:
          ref: __SECRET__
          system: 官網
        mapQuery: "Deer Park Heights Queenstown"
        warnings:
          - level: red
            text: 閘門認車牌。10/2 拿到租車後登入官網 Upcoming Bookings 把車牌填進訂單，不然閘門不開；相機讀不到就在鍵盤輸 PIN
          - level: red
            text: 入口換了新路，別只信 Google Maps，照 sources 裡的新入口導航走
          - level: amber
            text: 20:00 前要出園，閘門到點上鎖，超時自動收 NZD 100
        notes:
          - 訂單時段 10/3 08:00–20:00、一台車最多 8 人含小孩 [SRC:訂位確認 PDF]
          - 市區開過去約 20 分、園內 5 km 碎石路、有幾段陡 [SRC:訂位確認 PDF]
          - 廁所跟第一台飼料機都在入口進去約 500 m [SRC:訂位確認 PDF]
          - 飼料機只收 NZD 2 硬幣，先換好；飼料丟地上餵、不要在車邊餵 [SRC:訂位確認 PDF]
          - Hard Antler Block 那段有牌子的要全程待在車裡；有角的動物不要靠近 [SRC:訂位確認 PDF]
          - 不能帶寵物、不能下車走或騎車、不能烤肉
          - 驢最親人
        sources:
          - type: SRC
            label: 新入口導航（Google Maps）
            url: https://maps.app.goo.gl/qHRr1YcKoSEYtfch8
          - type: SRC
            label: 官網登入改車牌／取消
            url: https://booking.deerparkheights.co.nz/login
          - type: SRC
            label: 官網 Visiting
            url: https://deerparkheights.co.nz/visiting/
      - id: e-d03-02
        time: "20:30"
        duration: 60
        title: Fergburger 晚餐
        type: meal
        mapQuery: "Fergburger Queenstown"

