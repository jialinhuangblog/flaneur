      - id: e-d05-02
        time: "09:10"
        duration: 60
        title: Cromwell Fruit Sculpture 水果地標
        type: photo
        mapQuery: "Cromwell Fruit Sculpture"
      - id: e-d05-03
        time: "10:15"
        duration: 90
        title: Cromwell Heritage Precinct 舊城區走走休息
        type: attraction
        mapQuery: "Cromwell Heritage Precinct"
      - id: e-d05-04
        time: "12:00"
        duration: 60
        title: Wānaka Sequoia（有名的樹）
        type: photo
        mapQuery: "Wanaka Sequoia"
      - id: e-d05-05
        time: "13:00"
        duration: 60
        title: "#thatwanakatree 孤獨樹（Wānaka Willow Tree）"
        type: photo
        highlight: true
        mapQuery: "That Wanaka Tree New Zealand"
      - id: e-d05-06
        time: "14:00"
        duration: 80
        title: Wanaka 湖邊碼頭（Fish & Cruise）
        type: attraction
        mapQuery: "Wanaka Wharf"
      - id: e-d05-07
        time: "15:30"
        duration: 80
        title: Diamond Lake 步道（不想走就湖邊躺、跟市區走走）
        type: attraction
        mapQuery: "Diamond Lake Conservation Area Wanaka"
        notes:
          - Diamond Lake Lookout 2.5km 來回約 1hr；Rocky Mountain Summit 6km 來回 3–4hr、難度中 [SRC:Funliday PDF]
          - 步道入口停車場距 Wanaka 小鎮約 20 分 [SRC:Funliday PDF]
      - id: e-d05-08
        time: "17:00"
        title: 宿：Manuka Crescent Motel（Wanaka · 1 晚 · 10/5→10/6 退）
        type: hotel
        highlight: true
        mapQuery: "Manuka Crescent Motel Wanaka"
        notes:
          - 可洗衣服 [SRC:Funliday PDF]、還沒看到訂房確認信

  # =========================================================
  - id: day-06
    date: 2026-10-06
    weekday: Tue
    country: NZ
    title: Wanaka → Lindis Pass → Pukaki → Tekapo
    overview: 隘口拍照、高地鮭魚生魚片、兩個 Pukaki 觀景台、白天上 Mt John、晚上 Tekapo Springs 觀星
    events:
      - id: e-d06-01
        time: "08:00"
        duration: 90
        title: Lindis Pass 林迪斯隘口景觀台（路上拍照）
        type: photo
        mapQuery: "Lindis Pass Lookout"
        warnings:
          - level: amber
            text: 10 月清晨陰面可能結冰、等太陽出來再上山 [GUESS]
      - id: e-d06-02
        time: "09:40"
        duration: 60
        title: 高地鄉村鮭魚 生魚片（High Country Salmon）
        type: meal
        mapQuery: "High Country Salmon Twizel"
      - id: e-d06-03
        time: "11:00"
        duration: 45
        title: Peter's Lookout（必去觀景台）
        type: photo
        highlight: true
        mapQuery: "Peters Lookout Lake Pukaki"
      - id: e-d06-04
        time: "12:15"
        duration: 60
        title: Lake Pukaki Viewpoint 牛奶藍配雪山（必去觀景台）
        type: photo
        highlight: true
        mapQuery: "Lake Pukaki Viewpoint"
      - id: e-d06-05
        time: "13:50"
        duration: 60
        title: Mt John 約翰山大學天文臺（白天上山看湖景）
        type: attraction
        highlight: true
        mapQuery: "Mount John Observatory Tekapo"
        warnings:
          - level: amber
            text: 通道每日 10:00–16:00 開放自駕、$14 NZD/車、16:00 後只剩觀星團巴士 [SRC:Funliday PDF]
      - id: e-d06-06
        time: "14:50"
        duration: 60
        title: Astro Cafe（天文台旁邊的咖啡廳）
        type: meal
        mapQuery: "Astro Cafe Mount John"
      - id: e-d06-07
        time: "16:05"
        duration: 60
        title: 好牧羊人教堂 + Lake Tekapo Walkway（附近有小狗雕像）
        type: attraction
        mapQuery: "Church of the Good Shepherd Tekapo"
        notes:
          - 教堂內部免費參觀（建議捐 $5 NZD/人）、週三到週日 10:00–15:00、不保證開放、內部嚴禁拍照 [SRC:Funliday PDF]
      - id: e-d06-08
        time: "17:10"
        duration: 70
        title: Tekapo Springs 湖景泳池 spa + Stargazing
        type: attraction
        mapQuery: "Tekapo Springs"
      - id: e-d06-09
        time: "18:20"
        duration: 60
        title: Pines Beach 鵝卵石灘（可拍湖景+山景、天黑後可觀星）
        type: photo
        mapQuery: "Pines Beach Lake Tekapo"
      - id: e-d06-10
        time: "19:30"
        title: 宿：Tailor Made Tekapo Accommodation（南島 · 2 晚 · 10/6→10/8 退）
        type: hotel
        highlight: true
        mapQuery: "Tailor Made Tekapo Accommodation"
        notes:
          - Guesthouse & Hostel、四人房隔天換三人房 [SRC:Funliday PDF]
          - 還沒看到訂房確認信

  # =========================================================
  - id: day-07
    date: 2026-10-07
    weekday: Wed
    country: NZ
    title: 庫克山當天來回｜Hooker Valley + Kea Point
    overview: Hooker Valley 早上出發、Kea Point 下午、回 Tekapo（直升機在明早 10/8、截圖為準）
    events:
      - id: e-d07-01
        time: "08:00"
        duration: 90
        title: Tekapo → 庫克山 Aoraki（約 1.5hr、沿 Lake Pukaki）
        type: drive
      - id: e-d07-02
        time: "09:30"
        duration: 180
        title: Hooker Valley Track（全程平路吊橋、終點冰河湖、來回約 3hr）
        type: attraction
        highlight: true
        mapQuery: "Hooker Valley Track Aoraki Mount Cook"
        notes:
          - 路程較遠、適合早上出發、帶個簡單輕食慢慢走 [SRC:Funliday PDF]
      - id: e-d07-03
        time: "13:30"
        duration: 90
        title: Kea Point 步道（比較簡單走、有機會看到 Kea）
        type: attraction
        mapQuery: "Kea Point Track Mount Cook"
        notes:
          - 適合下午出發、時間較短可以輕鬆來回 [SRC:Funliday PDF]
      - id: e-d07-04
        time: "15:30"
        duration: 90
        title: 開回 Tekapo（沒看夠星可再看一晚、明天 7:15 要出門）
        type: drive

  # =========================================================
  - id: day-08
    date: 2026-10-08
    weekday: Thu
    country: NZ
    title: 冰川直升機一早飛 → Oamaru 看企鵝
    overview: 9:00 Tasman Heli Hike（已訂）、經 Elephant Rocks 進 Oamaru、黃眼企鵝、Moeraki、20:00 藍企鵝（已訂）
    events:
      - id: e-d08-01
        time: "07:15"
        duration: 90
        title: Tekapo → 庫克山機場（約 1.25hr、9:00 報到）
        type: drive
      - id: e-d08-02
        time: "09:00"
        duration: 180
        title: Tasman Glacier Heli Hike（直升機上冰川 + 冰上健行、9:00–12:00）
        type: attraction
        highlight: true
        booking:
          ref: __SECRET__
        mapQuery: "Mount Cook Airport"
        warnings:
          - level: amber
            text: 常因天氣取消、起飛前打 +64 3 435 1801 確認航班狀態
        notes:
          - 確認信寫 10/8（週四）9:00–12:00、以截圖為準；Funliday 排 10/7 是舊版 [SRC:用戶截圖]
          - 集合：Mount Cook Airport、辦公室在機場樓上、有免費停車 [SRC:用戶截圖]
          - 三人成人 [SRC:用戶截圖]
      - id: e-d08-03
        time: "12:30"
        duration: 105
        title: 庫克山 → Elephant Rocks 大象岩（Duntroon、往 Oamaru 路上）
        type: photo
        mapQuery: "Elephant Rocks Duntroon"
      - id: e-d08-04
        time: "14:45"
        duration: 60
        title: Oamaru 維多利亞老街區（Heritage Precinct）+ 蒸氣龐克
        type: attraction
        mapQuery: "Oamaru Victorian Precinct New Zealand"
      - id: e-d08-05
        time: "16:00"
        duration: 90
        title: Bushy Beach 看黃眼企鵝跟海豹（免費）
        type: attraction
        mapQuery: "Bushy Beach Oamaru"
        notes:
          - 黃眼企鵝最佳時段是太陽下山前兩小時、觀看距離較遠要一點運氣 [SRC:Funliday PDF]
      - id: e-d08-06
        time: "17:45"
        duration: 60
        title: Moeraki Boulders 圓石沙灘（大家會去的地方）
        type: photo
        highlight: true
        mapQuery: "Moeraki Boulders New Zealand"
        notes:
          - Oamaru 南方約 40 公里、車程約 30 分；停車場走 600 公尺、走咖啡廳那條進海灘每人 $2 NZD [SRC:Funliday PDF]
          - 退潮前後最能看完整輪廓、出門前查潮汐 [SRC:Funliday PDF]
      - id: e-d08-07
        time: "19:15"
        duration: 30
        title: Oamaru Lookout Point（俯瞰市區跟太平洋、離市區 5 分鐘）
        type: photo
        mapQuery: "Oamaru Lookout Point"
      - id: e-d08-08
        time: "20:00"
        duration: 90
        title: 藍企鵝夜間觀賞（世界最小企鵝上岸、中文場 1.5hr）
        type: attraction
        highlight: true
        booking:
          ref: __SECRET__
        cost: "$88.17 / 3 人"
        mapQuery: "Oamaru Blue Penguin Colony"
        notes:
          - 集合：Waterfront Rd, South Hill、提前 10–15 分到 [SRC:用戶截圖]
          - 嚴禁攝影 [SRC:用戶截圖]
      - id: e-d08-09
        time: "22:00"
        title: 宿：ASURE Ambassador Motor Lodge（南島 · 2 晚 · 10/8→10/10 退）
        type: hotel
        highlight: true
        address: 296 Thames Highway, Oamaru 9400
        booking:
          ref: __SECRET__
        mapQuery: "ASURE Ambassador Motor Lodge Oamaru"
        notes:
          - 入住 14:00 後、退房 10:00 前 [SRC:用戶截圖]

