    overview: 一早 Sandfly Bay 看海狗、市區（八角廣場、教堂、車站、Baldwin St）、信號山、信天翁中心、回程 Shag Point / Katiki 燈塔順路停、22:00 後 Oamaru 海邊看極光（CME 預報 G2）
    events:
      - id: e-d09-01
        time: "08:00"
        duration: 80
        title: Sandfly Bay 沙灘（海狗上岸）
        type: attraction
        highlight: true
