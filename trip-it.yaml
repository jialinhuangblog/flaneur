# 義大利 31 天（新天堂樂園 × 一路往南）
# seed： pnpm tsx scripts/seed.ts public/trip-it.yaml
# 日期全是佔位（2027-05-03 一 → 06-02 三），機票訂好後改 meta 跟每天的 date / weekday，再對一次星期幾休館。
# 路線：TPE → 米蘭 3 晚 → 威尼斯 2 晚 → 佛羅倫斯 3 晚 → 羅馬 5 晚 → 拿波里 4 晚 → 夜船 → 巴勒摩 3 晚 → 切法盧 7 晚 → 飛米蘭過夜 → TPE
# 機票：長榮 BR95 / BR96 桃園 ↔ 米蘭 Malpensa 來回，每天飛；西西里回米蘭靠 Ryanair PMO → MXP 另買一張。
# 西西里：巴勒摩只住到 Palazzo Adriano 那天（06:30 巴士，從 Cefalù 趕不上），之後整週住 Cefalù 發呆，朝聖點當一日遊。
# 原則：懶人玩法。只搭火車、巴士、船，不租車。景點在車站步行圈或公車可達。
# 沒事日：D4 米蘭、D8 佛羅倫斯、D14 羅馬、D18 拿波里、D21 巴勒摩、D24 D26 D28 D29 Cefalù。整天不排，卡片上掛的景點都是「想去再去」。
# 車、船、巴士、飛機時刻都是 2026 年 11 月同一個星期幾的班表，來源寫在各段 notes；2027 年 5 月的班表出來後要重查一次。
# 週一休：最後的晚餐、Brera、Uffizi、Accademia、Borghese、Ostia Antica。週二休：Fondazione Prada、Guggenheim、Cinecittà、MANN、Sansevero。梵蒂岡週日休（月底最後一個週日免費開）。
# 未訂：全部。

